name: Container image
run-name: 'Container ${{ inputs.request_id || github.sha }}'

on:
  push:
    branches: [chore/portainer-deployment]
  pull_request:
    branches: [chore/portainer-deployment]
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID for ari-deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python and PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.13"
          cache: true
      - name: Validate repository
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: |
          pdm install
          pdm run format
          git diff --exit-code
          pdm run lint
          xvfb-run --auto-servernum pdm run test
      - name: Build and test
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          image="checked-image:$SOURCE_COMMIT"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" --tag "$image" .
          test -f scripts/check_image.sh || { echo 'Add scripts/check_image.sh to test the built image.'; exit 1; }
          bash scripts/check_image.sh "$image"
          docker save "$image" | gzip -1 > "$RUNNER_TEMP/checked-image.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/chore/portainer-deployment'
        with:
          name: checked-image-${{ github.sha }}
          path: ${{ runner.temp }}/checked-image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/chore/portainer-deployment'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checked-image-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Publish the tested image to private GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          gzip -dc "$RUNNER_TEMP/checked-image.tar.gz" | docker load
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          image="ghcr.io/${SOURCE_REPOSITORY,,}:sha-$SOURCE_COMMIT"
          docker tag "checked-image:$SOURCE_COMMIT" "$image"
          owner_type="$(gh api "repos/$SOURCE_REPOSITORY" --jq .owner.type)"
          owner="${SOURCE_REPOSITORY%/*}"
          package="${SOURCE_REPOSITORY#*/}"
          scope=users
          if [ "$owner_type" = Organization ]; then scope=orgs; fi
          package_api="$scope/$owner/packages/container/${package,,}"
          # A new package starts private. Never append to an existing public package.
          if gh api "$package_api" > "$RUNNER_TEMP/existing-package.json" 2> "$RUNNER_TEMP/package-error.txt"; then
            test "$(jq -r .visibility "$RUNNER_TEMP/existing-package.json")" = private || {
              echo 'Existing package is not private; configure an explicit project policy first.'; exit 1;
            }
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/package-error.txt"; then
            echo 'Could not verify package access before publishing.'; exit 1
          fi
          docker push "$image"
          test "$(gh api "$package_api" --jq .visibility)" = private
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          jq -n --arg image "$digest" --arg commit "$SOURCE_COMMIT" --arg repository "$SOURCE_REPOSITORY" \
            '{image:$image, sourceCommit:$commit, repository:$repository}' > "$RUNNER_TEMP/release.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-release
          path: ${{ runner.temp }}/release.json
          retention-days: 30
          if-no-files-found: error
      - name: Clear registry login
        if: always()
        run: docker logout ghcr.io
